# Fichier généré par scripts/build-redirects.ts à partir de config/htaccess-base.conf : ne pas modifier public/.htaccess à la main.
# Hébergement o2switch (Apache).

Options -Indexes
DirectoryIndex index.html
ErrorDocument 404 /404.html
AddDefaultCharset utf-8

<IfModule mod_rewrite.c>
  RewriteEngine On
  # Ancienne adresse de test -> site officiel
  RewriteCond %{HTTP_HOST} ^(www\.)?nouveau\.unifoottv\.fr$ [NC]
  RewriteRule ^ https://unifoottv.fr%{REQUEST_URI} [L,R=301]
  # HTTPS obligatoire
  RewriteCond %{HTTPS} !=on
  RewriteCond %{HTTP:X-Forwarded-Proto} !=https
  RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
  # www -> sans www
  RewriteCond %{HTTP_HOST} ^www\.(.+)$ [NC]
  RewriteRule ^ https://%1%{REQUEST_URI} [L,R=301]
</IfModule>

# ---- Redirections (anciennes URL, épisodes supprimés ou déplacés) ----
# {{REDIRECTIONS}}

<IfModule mod_headers.c>
  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
  Header always set X-Frame-Options "SAMEORIGIN"
  Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
  Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; media-src 'self' https:; frame-src https:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https:; form-action 'self'; base-uri 'self'; frame-ancestors 'self'"
  # Adresse de test (nouveau.unifoottv.fr) : jamais indexée par Google
  <If "%{HTTP_HOST} =~ /^nouveau\./">
    Header always set X-Robots-Tag "noindex, nofollow"
  </If>
  <FilesMatch "\.(woff2|css|js)$">
    Header set Cache-Control "public, max-age=31536000, immutable"
  </FilesMatch>
  <FilesMatch "\.(png|jpe?g|webp|svg|ico)$">
    Header set Cache-Control "public, max-age=604800"
  </FilesMatch>
  <FilesMatch "\.(html|xml|txt)$">
    Header set Cache-Control "public, max-age=0, must-revalidate"
  </FilesMatch>
</IfModule>

<IfModule mod_mime.c>
  AddType application/manifest+json .webmanifest
  AddType application/rss+xml .rss
</IfModule>

<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml application/xml text/xml text/plain application/rss+xml application/manifest+json
</IfModule>
